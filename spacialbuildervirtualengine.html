<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spatial Builder | Virtual World</title>
    
    <!-- UI & ICONS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- MODERN THREE.JS IMPORT MAP -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');
        
        body { 
            background: #030005; 
            color: #e2e8f0; 
            font-family: 'Outfit', sans-serif; 
            overflow: hidden; 
            user-select: none;
        }

        /* Creative Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0b0c15; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: #8b5cf6; }

        .glass-panel {
            background: rgba(11, 12, 21, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .tool-btn {
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }
        .tool-btn:hover { background: rgba(139, 92, 246, 0.15); color: #fff; transform: translateY(-2px); }
        .tool-btn.active { 
            background: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%); 
            color: white; 
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); 
            border: none;
        }

        .action-btn {
            background: linear-gradient(90deg, #2563eb 0%, #7c3aed 100%);
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
        }

        .loader-overlay {
            position: fixed; inset: 0; background: #030005;
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .loader-overlay.hidden-loader { opacity: 0; pointer-events: none; }

        .toast {
            animation: slideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            background: rgba(15, 15, 20, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }
        @keyframes slideIn { from { transform: translateY(30px) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

        /* Range Slider Styling */
        input[type=range] {
            -webkit-appearance: none; width: 100%; background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
            background: #a78bfa; cursor: pointer; margin-top: -5px;
            box-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: #333; border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- HUD LAYER -->
    <div class="flex h-screen w-screen flex-col">
        
        <!-- HEADER -->
        <header class="h-14 bg-[#0b0c15] border-b border-white/5 flex items-center justify-between px-6 z-50 shadow-2xl relative">
            <div class="absolute bottom-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-purple-500/50 to-transparent"></div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-violet-600 to-fuchsia-600 flex items-center justify-center shadow-lg shadow-purple-900/20">
                        <i data-lucide="box" class="w-5 h-5 text-white"></i>
                    </div>
                    <div class="flex flex-col justify-center">
                        <span class="text-white font-black italic tracking-tighter text-lg leading-none">
                            SPATIAL<span class="text-fuchsia-500">.</span>BUILDER
                        </span>
                        <span class="text-[9px] text-gray-400 font-bold tracking-[0.2em] uppercase">Digital Doodles Core</span>
                    </div>
                </div>
            </div>
            
            <div class="flex gap-3">
                <button onclick="window.app.clearScene()" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 text-gray-400 border border-white/5 hover:bg-red-500/10 hover:text-red-400 hover:border-red-500/30 transition-all text-[10px] font-bold uppercase tracking-wide">
                    <i data-lucide="eraser" class="w-3.5 h-3.5"></i> Clear
                </button>
                <button onclick="window.app.exportScene()" class="action-btn flex items-center gap-2 px-5 py-2 rounded-xl text-white font-black uppercase text-[10px] tracking-widest shadow-lg">
                    <i data-lucide="package-check" class="w-3.5 h-3.5"></i> Build Release
                </button>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- SIDEBAR TOOLBAR -->
            <aside class="w-18 bg-[#0b0c15] border-r border-white/5 flex flex-col items-center py-6 gap-6 z-40 relative">
                <div class="absolute right-0 top-0 bottom-0 w-px bg-gradient-to-b from-transparent via-white/10 to-transparent"></div>
                
                <div class="flex flex-col gap-3 p-2 bg-white/5 rounded-2xl border border-white/5 shadow-inner">
                    <button id="btn-translate" onclick="window.app.setMode('translate')" class="tool-btn active w-10 h-10 rounded-xl flex items-center justify-center text-gray-400" title="Move (G)">
                        <i data-lucide="move" class="w-5 h-5"></i>
                    </button>
                    <button id="btn-rotate" onclick="window.app.setMode('rotate')" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400" title="Rotate (R)">
                        <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                    </button>
                    <button id="btn-scale" onclick="window.app.setMode('scale')" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-400" title="Scale (S)">
                        <i data-lucide="maximize" class="w-5 h-5"></i>
                    </button>
                </div>

                <div class="w-8 h-px bg-white/10"></div>

                <button onclick="document.getElementById('file-input').click()" class="tool-btn w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500/10 to-purple-500/10 border border-blue-500/20 text-blue-400 hover:text-white flex items-center justify-center transition-all group" title="Import GLB">
                    <i data-lucide="upload-cloud" class="w-6 h-6 group-hover:scale-110 transition-transform"></i>
                </button>
                <input type="file" id="file-input" class="hidden" accept=".glb,.gltf" onchange="window.app.handleImport(this)">

                <div class="mt-auto pb-4">
                    <button onclick="window.app.deleteSelected()" class="tool-btn w-10 h-10 rounded-xl flex items-center justify-center text-gray-500 hover:text-red-500 hover:bg-red-500/10"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
                </div>
            </aside>

            <!-- VIEWPORT -->
            <main id="viewport" class="flex-1 bg-[#050508] relative outline-none cursor-crosshair overflow-hidden">
                <!-- Branding Watermark -->
                <div class="absolute bottom-6 left-8 pointer-events-none opacity-50 z-10">
                    <h1 class="text-6xl font-black text-white/5 tracking-tighter leading-none select-none">SPATIAL</h1>
                </div>
            </main>

            <!-- INSPECTOR -->
            <aside class="w-80 bg-[#0b0c15] border-l border-white/5 flex flex-col z-40 shadow-2xl relative">
                <div class="absolute left-0 top-0 bottom-0 w-px bg-gradient-to-b from-transparent via-white/10 to-transparent"></div>

                <!-- LIGHTING CONTROLS -->
                <div class="p-5 border-b border-white/5 bg-[#10111a]">
                    <div class="flex items-center gap-2 text-[10px] font-black text-fuchsia-400 uppercase tracking-widest mb-4">
                        <i data-lucide="sun" class="w-3.5 h-3.5"></i> Atmosphere Lab
                    </div>
                    <div class="space-y-5">
                        <div class="group">
                            <div class="flex justify-between text-[10px] text-gray-400 mb-1.5 font-medium group-hover:text-white transition-colors">
                                <span>Scene Exposure</span><span id="val-exposure" class="font-mono text-fuchsia-400">1.0</span>
                            </div>
                            <input type="range" min="0.1" max="3.0" step="0.1" value="1.0" oninput="window.app.setExposure(this.value)">
                        </div>
                        <div class="group">
                            <div class="flex justify-between text-[10px] text-gray-400 mb-1.5 font-medium group-hover:text-white transition-colors">
                                <span>Global Intensity</span><span id="val-ambient" class="font-mono text-fuchsia-400">0.6</span>
                            </div>
                            <input type="range" min="0" max="2" step="0.1" value="0.6" oninput="window.app.setAmbient(this.value)">
                        </div>
                    </div>
                </div>

                <!-- SCENE GRAPH -->
                <div class="bg-[#14151e] px-5 py-3 border-b border-white/5 flex items-center justify-between">
                    <span class="text-[10px] font-black text-gray-500 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="layers" class="w-3.5 h-3.5 text-blue-500"></i> Scene Graph
                    </span>
                    <span id="obj-count" class="text-[9px] font-mono text-gray-500 bg-white/5 px-2 py-0.5 rounded">0 / 50</span>
                </div>
                
                <div id="outliner" class="flex-1 overflow-y-auto p-2 space-y-1 custom-scrollbar">
                    <div class="h-full flex flex-col items-center justify-center text-gray-800">
                        <i data-lucide="box-select" class="w-12 h-12 mb-3 opacity-20"></i>
                        <span class="text-[10px] font-bold uppercase tracking-widest">Empty</span>
                    </div>
                </div>

                <!-- STATS -->
                <div class="p-4 border-t border-white/5 bg-[#0b0c15]">
                    <div class="flex justify-between items-center text-[10px] text-gray-500 font-bold mb-2">
                        <span class="flex items-center gap-2"><i data-lucide="activity" class="w-3 h-3 text-blue-500"></i> GPU DrawCalls</span>
                        <span id="draw-calls" class="text-white font-mono">0</span>
                    </div>
                    <div class="flex justify-between items-center text-[10px] text-gray-500 font-bold">
                        <span class="flex items-center gap-2"><i data-lucide="hard-drive" class="w-3 h-3 text-purple-500"></i> Memory Est.</span>
                        <span id="mem-stat" class="text-green-400 font-mono">0 MB</span>
                    </div>
                </div>
            </aside>
        </div>

        <!-- FOOTER -->
        <footer class="h-9 bg-[#0b0c15] border-t border-white/5 flex items-center px-6 justify-between text-[10px] font-black text-gray-500 uppercase tracking-tighter z-50">
            <div class="flex gap-6">
                <div class="flex items-center gap-2 text-green-500/80">
                    <span class="relative flex h-2 w-2">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    ONLINE
                </div>
                <span id="fps-counter" class="text-gray-600 font-mono">60 FPS</span>
            </div>
            <div id="status-bar" class="px-4 py-1 rounded-lg bg-white/5 text-gray-400 border border-white/5 shadow-inner tracking-widest">SYSTEM IDLE</div>
        </footer>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 flex flex-col gap-2 z-[100] pointer-events-none"></div>

    <!-- LOADER -->
    <div id="loader" class="loader-overlay">
        <div class="flex flex-col items-center gap-6">
            <div class="relative">
                <div class="w-16 h-16 border-4 border-white/10 rounded-full"></div>
                <div class="absolute top-0 left-0 w-16 h-16 border-4 border-fuchsia-500 rounded-full border-t-transparent animate-spin"></div>
                <i data-lucide="zap" class="w-6 h-6 text-white absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></i>
            </div>
            <div class="flex flex-col items-center gap-1">
                <span id="loader-text" class="text-sm font-black uppercase tracking-[0.2em] text-white">Connecting...</span>
                <span class="text-[10px] font-bold text-fuchsia-500 uppercase tracking-widest">Digital Doodles Core</span>
            </div>
            <div id="loader-error" class="hidden mt-4 bg-red-900/50 border border-red-500 text-red-200 px-4 py-2 rounded text-xs">
                Init Failed. Check Console.
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { Sky } from 'three/addons/objects/Sky.js'; // Imported for future skybox features, though currently unused to avoid errors if not fully integrated

        class SpatialApp {
            constructor() {
                this.objects = [];
                this.mixers = [];
                this.selectedId = null;
                this.maxObjects = 50;
                this.totalSize = 0;
                this.clock = new THREE.Clock();
                
                // Failsafe timeout
                this.loadTimeout = setTimeout(() => {
                    const loaderText = document.getElementById('loader-text');
                    if(loaderText) loaderText.innerText = "Network Delay...";
                    if(document.getElementById('loader') && !document.getElementById('loader').classList.contains('hidden-loader')) {
                        console.warn("Forcing start due to network timeout");
                         document.getElementById('loader').classList.add('hidden-loader');
                    }
                }, 8000);

                try {
                    this.initEngine();
                    this.initListeners();
                    lucide.createIcons();
                    window.app = this;
                } catch (e) {
                    console.error("Critical Init Error:", e);
                    document.getElementById('loader-error').classList.remove('hidden');
                    document.getElementById('loader-text').innerText = "System Failure";
                }
            }

            initEngine() {
                const container = document.getElementById('viewport');
                if(!container) throw new Error("Viewport missing");
                
                const width = container.clientWidth;
                const height = container.clientHeight;

                document.getElementById('loader-text').innerText = "Starting GPU...";

                // Renderer
                this.renderer = new THREE.WebGLRenderer({ 
                    antialias: true, 
                    alpha: true, 
                    powerPreference: "high-performance" 
                });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.0;
                container.appendChild(this.renderer.domElement);

                // Scene
                this.scene = new THREE.Scene();
                
                // Camera
                this.camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
                this.camera.position.set(10, 8, 12);

                document.getElementById('loader-text').innerText = "Baking Light...";

                // Studio Environment (GI)
                const pmremGenerator = new THREE.PMREMGenerator(this.renderer);
                this.scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
                
                // Lights
                this.ambientLight = new THREE.HemisphereLight(0xffffff, 0x000000, 0.6);
                this.scene.add(this.ambientLight);

                this.dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
                this.dirLight.position.set(10, 15, 10);
                this.dirLight.castShadow = true;
                this.dirLight.shadow.mapSize.set(1024, 1024); // Optimized shadow map
                this.scene.add(this.dirLight);

                // Grid
                const grid = new THREE.GridHelper(60, 60, 0x333333, 0x222222);
                this.scene.add(grid);

                // Controls
                this.orbit = new OrbitControls(this.camera, this.renderer.domElement);
                this.orbit.enableDamping = true;
                this.orbit.dampingFactor = 0.05;

                // FIX: Use new TransformControls(...) not new THREE.TransformControls(...)
                this.transform = new TransformControls(this.camera, this.renderer.domElement);
                this.transform.addEventListener('dragging-changed', (e) => this.orbit.enabled = !e.value);
                this.transform.addEventListener('change', () => this.updateUIStats());
                this.scene.add(this.transform);

                // Raycaster
                this.raycaster = new THREE.Raycaster();
                this.mouse = new THREE.Vector2();

                // Loop
                this.animate = this.animate.bind(this);
                requestAnimationFrame(this.animate);
                
                // Clear timeout and hide loader
                clearTimeout(this.loadTimeout);
                setTimeout(() => document.getElementById('loader').classList.add('hidden-loader'), 800);
            }

            animate() {
                requestAnimationFrame(this.animate);
                
                const delta = this.clock.getDelta();
                this.mixers.forEach(m => m.update(delta));
                
                this.orbit.update();
                this.renderer.render(this.scene, this.camera);
                
                // Stats
                if(this.renderer.info.render.frame % 60 === 0) {
                   document.getElementById('draw-calls').innerText = this.renderer.info.render.calls;
                }
            }

            // --- LIGHTING CONTROLS ---
            setExposure(val) {
                this.renderer.toneMappingExposure = parseFloat(val);
                document.getElementById('val-exposure').innerText = val;
            }

            setAmbient(val) {
                this.ambientLight.intensity = parseFloat(val);
                this.dirLight.intensity = parseFloat(val) * 1.5;
                document.getElementById('val-ambient').innerText = val;
            }

            // --- IMPORT LOGIC ---
            handleImport(input) {
                const file = input.files[0];
                if (!file) return;

                if (this.objects.length >= this.maxObjects) {
                    this.notify("Scene Capacity Reached", "error");
                    return;
                }
                
                const fileSizeMB = file.size / (1024 * 1024);
                this.totalSize += fileSizeMB;
                document.getElementById('mem-stat').innerText = `${this.totalSize.toFixed(1)} MB`;

                document.getElementById('loader').classList.remove('hidden-loader');
                document.getElementById('loader-text').innerText = "Parsing Geometry...";
                
                const url = URL.createObjectURL(file);
                // FIX: Use new GLTFLoader() not new THREE.GLTFLoader()
                const loader = new GLTFLoader();
                const draco = new DRACOLoader();
                draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
                loader.setDRACOLoader(draco);

                loader.load(url, (gltf) => {
                    const mesh = gltf.scene;
                    
                    // Normalize
                    const box = new THREE.Box3().setFromObject(mesh);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 2 / Math.max(size.x, size.y, size.z);
                    
                    if (maxDim > 0) {
                        mesh.scale.setScalar(scale);
                        mesh.position.sub(center.multiplyScalar(scale));
                        mesh.position.y = 0;
                    }

                    // Shadows
                    mesh.traverse(c => {
                        if (c.isMesh) {
                            c.castShadow = true;
                            c.receiveShadow = true;
                        }
                    });

                    // Animation
                    if (gltf.animations.length) {
                        const mixer = new THREE.AnimationMixer(mesh);
                        gltf.animations.forEach(clip => mixer.clipAction(clip).play());
                        this.mixers.push(mixer);
                        mesh.userData.mixer = mixer;
                    }

                    const id = Math.random().toString(36).substr(2, 9);
                    mesh.userData.id = id;
                    mesh.userData.isAsset = true; // Tag for raycasting
                    
                    this.scene.add(mesh);
                    this.objects.push({ id, mesh: mesh, name: file.name });
                    
                    this.selectObject(id);
                    this.renderOutliner();
                    document.getElementById('loader').classList.add('hidden-loader');
                    this.notify("Asset Imported");
                }, undefined, (e) => {
                    console.error(e);
                    document.getElementById('loader').classList.add('hidden-loader');
                    this.notify("Import Failed", "error");
                });
            }

            selectObject(id) {
                this.selectedId = id;
                
                // Reset Visuals
                this.objects.forEach(o => {
                    o.mesh.traverse(c => { if(c.isMesh && c.material.emissive) c.material.emissive.setHex(0x000000); });
                });

                const obj = this.objects.find(o => o.id === id);
                const propsPanel = document.getElementById('active-properties');

                if (obj) {
                    this.transform.attach(obj.mesh);
                    if(propsPanel) {
                        propsPanel.style.opacity = '1';
                        propsPanel.style.pointerEvents = 'auto';
                    }
                    document.getElementById('status-text').innerText = `Selected: ${obj.name}`;
                    
                    // Highlight
                    obj.mesh.traverse(c => { if(c.isMesh && c.material.emissive) c.material.emissive.setHex(0x111111); });
                    
                    this.updateUIStats();
                } else {
                    this.transform.detach();
                    if(propsPanel) {
                        propsPanel.style.opacity = '0.5';
                        propsPanel.style.pointerEvents = 'none';
                    }
                    document.getElementById('status-text').innerText = "Waiting for input...";
                }
                this.renderOutliner();
            }

            updateUIStats() {
                if (!this.selectedId) return;
                const obj = this.objects.find(o => o.id === this.selectedId);
                if (obj) {
                    document.getElementById('val-x').innerText = obj.mesh.position.x.toFixed(2);
                    document.getElementById('val-y').innerText = obj.mesh.position.y.toFixed(2);
                    document.getElementById('val-z').innerText = obj.mesh.position.z.toFixed(2);
                }
            }

            renderOutliner() {
                const container = document.getElementById('outliner');
                container.innerHTML = '';
                
                if (this.objects.length === 0) {
                    container.innerHTML = `<div class="py-8 flex flex-col items-center justify-center text-neutral-600"><span class="text-[11px]">No Objects</span></div>`;
                    return;
                }

                this.objects.slice().reverse().forEach(obj => {
                    const el = document.createElement('div');
                    const isActive = obj.id === this.selectedId;
                    el.className = `flex items-center gap-3 px-3 py-2.5 rounded-lg cursor-pointer transition-all border ${isActive ? 'bg-white text-black border-white shadow-md' : 'border-transparent hover:bg-white/5 text-neutral-400'}`;
                    el.onclick = (e) => { e.stopPropagation(); this.selectObject(obj.id); };
                    
                    // Lucide Box Icon
                    const icon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>`;
                    
                    el.innerHTML = `${icon}<span class="text-[11px] font-medium truncate">${obj.name}</span>`;
                    container.appendChild(el);
                });
            }

            deleteSelected() {
                if (!this.selectedId) return;
                const targetIndex = this.objects.findIndex(o => o.id === this.selectedId);
                if (targetIndex > -1) {
                    const target = this.objects[targetIndex];
                    
                    this.transform.detach();
                    this.scene.remove(target.mesh);
                    
                    if (target.mesh.userData.mixer) {
                         const mIdx = this.mixers.indexOf(target.mesh.userData.mixer);
                         if (mIdx > -1) this.mixers.splice(mIdx, 1);
                    }

                    this.objects.splice(targetIndex, 1);
                    this.selectedId = null;
                    this.updateOutliner();
                    this.notify("Object Deleted");
                }
            }

            clearScene() {
                this.objects.forEach(o => this.scene.remove(o.mesh));
                this.objects = [];
                this.mixers = [];
                this.totalSize = 0;
                document.getElementById('mem-stat').innerText = "0 MB";
                this.selectObject(null);
                this.notify("Scene Cleared");
            }

            exportScene() {
                if (this.objects.length === 0) return this.notify("Nothing to export", "error");
                const exporter = new GLTFExporter();
                const exportScene = new THREE.Scene();
                this.objects.forEach(o => exportScene.add(o.mesh.clone()));
                
                exporter.parse(exportScene, (result) => {
                    const blob = new Blob([JSON.stringify(result)], { type: 'application/json' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = 'spatial_build.gltf';
                    link.click();
                    this.notify("Build Exported");
                });
            }

            setMode(mode) {
                this.transform.setMode(mode);
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                const btn = document.getElementById(`btn-${mode}`);
                if(btn) btn.classList.add('active');
            }
            
            setTab(tab) {
                const props = document.getElementById('view-properties');
                const scene = document.getElementById('view-scene');
                const tProp = document.getElementById('tab-properties');
                const tScene = document.getElementById('tab-scene');
                
                if (tab === 'properties') {
                    props.style.display = 'block';
                    scene.style.display = 'none';
                    tProp.className = "flex-1 py-2 text-[11px] font-medium rounded-lg bg-white/10 text-white shadow-sm transition-all";
                    tScene.className = "flex-1 py-2 text-[11px] font-medium text-neutral-500 hover:text-neutral-300 transition-all";
                } else {
                    props.style.display = 'none';
                    scene.style.display = 'block';
                    tProp.className = "flex-1 py-2 text-[11px] font-medium text-neutral-500 hover:text-neutral-300 transition-all";
                    tScene.className = "flex-1 py-2 text-[11px] font-medium rounded-lg bg-white/10 text-white shadow-sm transition-all";
                }
            }

            // Lighting Controls
            setExposure(val) {
                this.renderer.toneMappingExposure = parseFloat(val);
                document.getElementById('lbl-exposure').innerText = val;
            }
            
            setAmbient(val) {
                this.ambientLight.intensity = parseFloat(val);
                this.dirLight.intensity = parseFloat(val) * 1.5;
                document.getElementById('val-ambient').innerText = val;
            }

            notify(msg, type = 'info') {
                const t = document.createElement('div');
                const accent = type === 'error' ? 'border-red-500/50 text-red-100' : 'border-violet-500/50 text-white';
                t.className = `toast px-5 py-2.5 rounded-2xl text-[11px] font-bold shadow-2xl flex items-center gap-3 ${accent}`;
                t.innerHTML = `<div class="w-1.5 h-1.5 rounded-full ${type === 'error' ? 'bg-red-500' : 'bg-green-400'}"></div> ${msg}`;
                document.getElementById('toast-container').appendChild(t);
                setTimeout(() => t.remove(), 3000);
            }

            initListeners() {
                window.addEventListener('resize', () => {
                    const w = window.innerWidth; 
                    const h = window.innerHeight;
                    this.camera.aspect = w / h;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(w, h);
                });

                document.getElementById('viewport').addEventListener('mousedown', (e) => {
                    if (this.transform.dragging) return;
                    const rect = this.renderer.domElement.getBoundingClientRect();
                    this.mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                    this.mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
                    
                    this.raycaster.setFromCamera(this.mouse, this.camera);
                    
                    const candidates = [];
                    this.objects.forEach(o => o.mesh.traverse(c => { if(c.isMesh) candidates.push(c); }));
                    
                    const intersects = this.raycaster.intersectObjects(candidates);
                    
                    if (intersects.length > 0) {
                        let root = intersects[0].object;
                        while(root.parent && !root.userData.isAsset) root = root.parent;
                        if(root.userData.isAsset) this.selectObject(root.userData.id);
                    } else {
                        this.selectObject(null);
                    }
                });

                window.addEventListener('keydown', (e) => {
                    if (e.key === 'g') this.setMode('translate');
                    if (e.key === 'r') this.setMode('rotate');
                    if (e.key === 's') this.setMode('scale');
                    if (e.key === 'Delete') this.deleteSelected();
                });
            }
        }

        window.onload = () => { window.app = new SpatialApp(); };
    </script>
</body>
</html>
